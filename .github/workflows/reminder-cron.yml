name: Send scheduled reminders

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Call the reminder endpoint
        env:
          REMINDER_CRON_URL: ${{ secrets.REMINDER_CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [[ -z "$REMINDER_CRON_URL" || -z "$CRON_SECRET" ]]; then
            echo "::error::Set REMINDER_CRON_URL and CRON_SECRET in the repository Actions secrets."
            exit 1
          fi

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 2 \
            --retry-delay 5 \
            --max-time 30 \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "$REMINDER_CRON_URL"
